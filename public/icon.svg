<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050D8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#ED1E24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid rounded squircle for 100% contrast on dark/light tabs & search results -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"/>

  <g transform="translate(-28, -26)">
    <!-- Iconic Smartphone Frame (Left / Center) -->
    <g filter="url(#shadow)">
      <!-- Smartphone body -->
      <rect x="76" y="96" width="168" height="320" rx="34" fill="none" stroke="#FFFFFF" stroke-width="26"/>
      <!-- Speaker notch -->
      <rect x="130" y="122" width="60" height="12" rx="6" fill="#FFFFFF"/>
      <!-- Home bar -->
      <rect x="124" y="378" width="72" height="14" rx="7" fill="#FFFFFF"/>
    </g>

    <!-- Bold Stylized Galaxy "G" with Red & White Brand Accents -->
    <g filter="url(#shadow)">
      <!-- Red dynamic crescent / accent swoosh -->
      <path d="M 324 116 C 248 116 200 168 184 220 C 196 204 220 180 260 172 C 304 164 340 180 376 210 L 416 168 C 388 136 358 116 324 116 Z" fill="url(#redAccent)"/>

      <!-- Main Bold G letterform -->
      <path d="M 330 156 C 244 156 196 216 196 280 C 196 348 248 408 340 408 C 416 408 450 366 454 306 L 330 306 L 330 252 L 498 252 C 504 366 440 456 338 456 C 218 456 148 376 148 280 C 148 184 222 108 338 108 C 392 108 436 128 472 164 L 434 200 C 408 174 374 156 330 156 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>